[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "behave-comments"
version = "0.1.0"
description = "Parse doc strings, extract metadata from comments, and declare lifecycle hooks in Behave .feature files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Mathias Paulenko" }]
keywords = ["behave", "gherkin", "comments", "annotations", "docstring", "lifecycle"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: BDD",
]
dependencies = ["behave>=1.2.6"]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyyaml>=6.0",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/MathiasPaulenko/behave-comments"
Repository = "https://github.com/MathiasPaulenko/behave-comments"
Issues = "https://github.com/MathiasPaulenko/behave-comments/issues"

[tool.hatch.build.targets.wheel]
packages = ["behave_comments"]

[tool.hatch.build.targets.wheel.force-include]
"behave_comments/py.typed" = "behave_comments/py.typed"

[tool.hatch.build.targets.sdist]
include = ["behave_comments", "tests", "README.md", "LICENSE"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN001", "ANN201"]

[tool.ruff.lint.isort]
known-first-party = ["behave_comments"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "behave.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["behave_comments"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90
